name: CI/CD - Controle de Treinos

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: python -m pytest
        env:
          PYTHONPATH: .

  docker:
    name: Build e Publicacao Docker
    runs-on: ubuntu-latest
    needs: testes

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagem Docker
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/controle-treinos:latest .

      - name: Publicar imagem no GHCR
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/controle-treinos:latest
